syntax = "proto3";

package example;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
}

message CreateUserRequest {
  string customerId = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
  bool active = 5;
  Address address = 6;
  repeated string tags = 7;
}

message CreateUserResponse {
  string userId = 1;
  bool success = 2;
  string message = 3;
}

message GetUserRequest {
  string userId = 1;
}

message GetUserResponse {
  string userId = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
  bool active = 5;
  Address address = 6;
}

message ListUsersRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 totalCount = 2;
}

message User {
  string userId = 1;
  string name = 2;
  string email = 3;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zipCode = 4;
  string country = 5;
}
